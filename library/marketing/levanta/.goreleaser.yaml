version: 2
project_name: levanta-pp-cli
changelog:
  disable: true
builds:
  - id: levanta-pp-cli
    main: ./cmd/levanta-pp-cli
    binary: levanta-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/marketing/levanta/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: levanta-pp-mcp
    main: ./cmd/levanta-pp-mcp
    binary: levanta-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: levanta-pp-cli
    repository:
      owner: 
      name: homebrew-tap
    homepage: "https://github.com//levanta-pp-cli"
    description: "The payout ledger for Levanta creator commerce: unpaid invoices, link earnings, and seller creator ROI from a local store."
    install: |
      bin.install "levanta-pp-cli"
      bin.install "levanta-pp-mcp"
